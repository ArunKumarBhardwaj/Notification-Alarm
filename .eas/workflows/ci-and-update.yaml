name: CI & Auto OTA Release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Lint & Typecheck
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - run: yarn lint
      - run: yarn typecheck

  publish_ota:
    name: Publish Production OTA Update
    needs: [validate]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    type: update
    params:
      channel: production
      message: ${{ github.event.head_commit.message || 'Automated OTA update' }}

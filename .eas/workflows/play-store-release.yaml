name: Build & Submit to Google Play Store

on:
  push:
    tags:
      - 'v*' # Triggers on git tags like v1.0.1

jobs:
  validate:
    name: Lint & Typecheck
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - run: yarn lint
      - run: yarn typecheck

  build_android:
    name: Build Android App Bundle (AAB)
    needs: [validate]
    type: build
    params:
      platform: android
      profile: production

  # Tag releases go to Internal Testing. Promote the same AAB later with:
  #   eas submit --profile closed --latest
  #   eas submit --profile production --latest
  submit_internal:
    name: Submit to Internal Testing
    needs: [build_android]
    type: submit
    params:
      build_id: ${{ needs.build_android.outputs.build_id }}
      profile: internal

  # Uncomment to also push the same build to closed testing on every tag:
  # submit_closed:
  #   name: Submit to Closed Testing
  #   needs: [build_android]
  #   type: submit
  #   params:
  #     build_id: ${{ needs.build_android.outputs.build_id }}
  #     profile: closed

  # Uncomment to also push the same build to production on every tag:
  # submit_production:
  #   name: Submit to Production
  #   needs: [build_android]
  #   type: submit
  #   params:
  #     build_id: ${{ needs.build_android.outputs.build_id }}
  #     profile: production
